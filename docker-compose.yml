version: "3.9"

services:
  # 🐘 PHP (Symfony)
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
      # Removed www.conf mount to avoid Windows mount issues
    networks:
      - gym_network
    expose:
      - 9000
    depends_on:
      - mysql

  # 🌐 NGINX
  nginx:
    image: nginx:stable
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - gym_network

  # 🗄️ MySQL
  mysql:
    image: mysql:8.0
    container_name: gym_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - gym_mysql_data:/var/lib/mysql
    networks:
      - gym_network

  # 🧭 phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gym_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - gym_network

volumes:
  gym_mysql_data:

networks:
  gym_network:
    driver: bridge
