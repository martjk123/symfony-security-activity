services:
    # Default configuration for services in App\
    _defaults:
        autowire: true
        autoconfigure: true

    # --- existing services ---
    App\Security\AccessDeniedHandler:
        autowire: true
        autoconfigure: true
        public: true

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

 
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'