security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    providers:
        in_memory:
            memory:
                users:
                    admin:
                        # password = password
                        password: "$2y$13$EDKvTa6kU0wuuJ4LWOl68eBZDRt.FnkH4pe.MpMoFyqT8nnFhkRNm"
                        roles: ["ROLE_ADMIN"]

                    user:
                        # password = password
                        password: "$2y$13$EDKvTa6kU0wuuJ4LWOl68eBZDRt.FnkH4pe.MpMoFyqT8nnFhkRNm"
                        roles: ["ROLE_USER"]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            http_basic: ~

    access_control:
        - { path: ^/dashboard, roles: ROLE_USER }
